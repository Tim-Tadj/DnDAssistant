# Test profile: use a dedicated test database. We don't run Flyway
# in tests — instead we let Spring's schema.sql + the test fixtures
# seed the data. In CI we'd swap to Testcontainers; locally this lets
# the dev box run the suite without Docker socket requirements.

spring.datasource.url=${TEST_POSTGRES_URL:jdbc:postgresql://localhost:55432/dnd_assistant_test}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway still runs so the schema is consistent with dev. We let the
# @Sql annotations in the tests truncate after each method.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.sql.init.mode=never

# CORS for tests (we don't make browser requests, but the bean wires up
# a property).
frontend.cors.origins=http://localhost:3000
