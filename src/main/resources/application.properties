spring.application.name=dnd-assistant

# Server
server.port=${SERVER_PORT:8081}

# PostgreSQL — overridable via env. Defaults match postgres/docker-compose.yml.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:55432/dnd_assistant}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Run schema.sql on startup (idempotent, IF NOT EXISTS everywhere).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

# CORS for the dev frontend (CRA on :3000).
frontend.cors.origins=${FRONTEND_CORS_ORIGINS:http://localhost:3000}

# Jackson: respect Java time types if/when we add them.
spring.jackson.serialization.write-dates-as-timestamps=false

# Make the JDBC URL visible at startup so auth/config issues are obvious.
logging.level.com.zaxxer.hikari=DEBUG
