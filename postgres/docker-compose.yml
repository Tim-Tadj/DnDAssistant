services:

  postgres:
    image: postgres
    container_name: postgres
    restart: always
    shm_size: 128mb
    volumes:
      - type: tmpfs
        target: /dev/shm_size
        tmpfs:
          size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-dnd_assistant}
      # Local dev: skip scram-sha-256 password negotiation. The image supports
      # POSTGRES_HOST_AUTH_METHOD=trust, which writes a pg_hba.conf allowing
      # all connections from any host without a password. DO NOT use in
      # production; the dev story can later flip to the default (scram-sha-256)
      # and pick up the env-driven password.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    networks:
      - postgresnetwork

  adminer:
    image: adminer
    depends_on:
      - postgres
    links:
      - postgres:postgres
    networks:
      - postgresnetwork
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: dndassistant-backend
    container_name: dndassistant-backend
    depends_on:
      - postgres
    environment:
      SERVER_PORT: 8081
      POSTGRES_URL: jdbc:postgresql://postgres:5432/dnd_assistant
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      FRONTEND_CORS_ORIGINS: ${FRONTEND_CORS_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-32-bytes-minimum}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    networks:
      - postgresnetwork
    restart: unless-stopped

networks:
  postgresnetwork:
    driver: bridge
